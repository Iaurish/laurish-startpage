<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title> ~ </title>
    <link rel="icon" type="image/jpg" href="img/favicon.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="accent" id="top"></div>
    <div class="weather" id="weathercontainer">
        <div id="weather-display" onclick="promptManualLocation()" title="locating...">
            <div id="weather-info">
                <span id="weather-icon"></span> <span id="weather-temp">locating...</span>
            </div>
            <div id="weather-desc"></div>
        </div>
        
        <div id="location-input-container" style="display: none;">
            > <input type="text" id="location-input" placeholder="enter city..." autocomplete="off">
        </div>
    </div>
    <div class="time" id="datecontainer">
            <div id="date"></div>
            <div id="time"></div>
    </div>
    <div class="containerwrapper">
        <div class="container">
            <div class="container-top"></div>

            <div class="container-middle">
                <!-- TAB 1 -->
                <div class="main" id="main1">
                    <div class="section" id="link-col-1"></div>
                    <div class="section" id="link-col-2"></div>
                    <div class="section" id="link-col-3"></div>

                    <div id="edit-btn-zone">
                        <span id="edit-links-btn" onclick="toggleLinkMenu()">edit</span>
                    </div>

                    <div id="link-menu" style="display: none;">
                        <div style="margin-bottom: 15px; font-weight: bold;">> add new link</div>
                        
                        <input type="text" id="new-link-name" placeholder="name (e.g. youtube)" autocomplete="off">
                        <input type="text" id="new-link-url" placeholder="url (e.g. youtube.com)" autocomplete="off">
                        
                        <select id="new-link-col">
                            <option value="1">column 1</option>
                            <option value="2">column 2</option>
                            <option value="3">column 3</option>
                        </select>
                        
                        <div style="margin-top: 15px; display: flex; gap: 10px;">
                            <button class="notebutton" onclick="saveNewLink()" style="width: 50px;">save</button>
                            <button class="notebutton" onclick="toggleLinkMenu()" style="width: 60px;">cancel</button>
                        </div>
                        <div style="margin-top: 15px; font-size: 11px; color: #555;">
                            * right-click any link to delete it
                        </div>
                    </div>
                </div>

                <!-- TAB 2 -->
                <div class="main" id="main2">
                <iframe 
                    id="player" 
                    src="https://www.youtube.com/embed/Tj5C0b5Dqng"
                    frameborder="0" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
                </iframe>
                </div>

                <!-- TAB 3 -->
                <div class="main" id="main3" style="justify-content:center; align-items: center; text-align: center;">
                        this is a placeholder page. <br />
                        please don't think too much about it.
                </div>

                <!-- SIDEBAR -->
                <div class="sidebar" id="waifupic"></div>
            </div>

            <div class="container-bottom">
                <div class="button" id="button1"></div>
                <div class="button" id="button2"></div>
                <div class="button" id="button3"></div>
                <div class="search">
                    <form action="https://google.com/search" target="_blank">
                        <input name="q" placeholder="search..." autofocus>
                    </form>
                </div>
                <div class="quote" id="waifuname"></div>
            </div>
        </div>
        
        <div class="accent" id="division"></div>

        <div class="notes" id="notes">
            <div class="notecreation">
                <span class="newnote" id="newnote" onclick="toggleForm()">new note...</span>
                <div id="formwrapper" style="display: none;">
                    <textarea id="notetaker" placeholder="note..." onkeydown="autoGrow(this)"></textarea>
                    <button class="notebutton" onclick="newNote()">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/waifus.js"></script>
    <script src="js/time.js"></script>
    <script src="js/buttons.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/links.js"></script>
    <script>
    window.addEventListener('DOMContentLoaded', () => {
        document.querySelector('.search input[name="q"]').focus();
    });
    </script>
</body>
</html>
